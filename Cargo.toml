[workspace]
resolver = "3"
members = ["crates/wine", "crates/rbxweb", "crates/rbxbin", "crates/salt", "crates/layer"]

[workspace.package]
version = "2.0.7"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Glockerz/Salt"

[workspace.dependencies]
wine = { path = "crates/wine" }
rbxweb = { path = "crates/rbxweb" }
rbxbin = { path = "crates/rbxbin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
libc = "0.2"
thiserror = "2"
flate2 = "1"
tar = "0.4"
object = { version = "0.37", default-features = false, features = ["read_core", "pe", "elf", "std"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
