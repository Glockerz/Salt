<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#deddda"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c0bfbc"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3d6db5"/>
      <stop offset="0.5" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c5aa6"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="64" cy="118" rx="34" ry="5" fill="#000" opacity="0.18"/>
  <!-- body -->
  <path d="M38 44 h52 l6 62 a10 10 0 0 1 -10 11 h-44 a10 10 0 0 1 -10 -11 z" fill="url(#glass)" stroke="#9a9996" stroke-width="2"/>
  <!-- salt inside -->
  <path d="M36.6 74 h54.8 l3.2 32 a8 8 0 0 1 -8 9 h-45.2 a8 8 0 0 1 -8 -9 z" fill="#f6f5f4"/>
  <path d="M36.6 74 q13.7 -6 27.4 0 t27.4 0" fill="none" stroke="#d5d3cf" stroke-width="2"/>
  <!-- cap -->
  <path d="M34 30 a30 16 0 0 1 60 0 v12 a4 4 0 0 1 -4 4 h-52 a4 4 0 0 1 -4 -4 z" fill="url(#cap)" stroke="#1a4d8f" stroke-width="2"/>
  <g fill="#1a3f73">
    <circle cx="52" cy="24" r="3"/>
    <circle cx="64" cy="21" r="3"/>
    <circle cx="76" cy="24" r="3"/>
    <circle cx="58" cy="31" r="3"/>
    <circle cx="70" cy="31" r="3"/>
  </g>
  <!-- falling grains -->
  <g fill="#ffffff" stroke="#9a9996" stroke-width="1">
    <rect x="61" y="4" width="5" height="5" rx="1" transform="rotate(20 63 6)"/>
    <rect x="45" y="8" width="4" height="4" rx="1" transform="rotate(-15 47 10)"/>
    <rect x="79" y="9" width="4" height="4" rx="1" transform="rotate(35 81 11)"/>
  </g>
</svg>
